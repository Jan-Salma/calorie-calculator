<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalorická Kalkulačka · Fitness Fibel 2.0</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Outfit:wght@700;800;900&display=swap" rel="stylesheet">

<script src="locales/sk_SK.js"></script>
<script src="locales/en_EN.js"></script>
<script src="locales/de_DE.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { background:#0f172a; color:#e2e8f0; font-family:'DM Sans','Segoe UI',sans-serif; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:18px; height:18px; border-radius:50%; background:#fff; cursor:pointer; box-shadow:0 0 6px rgba(0,0,0,.4); }
input[type=range]::-moz-range-thumb    { width:18px; height:18px; border-radius:50%; background:#fff; cursor:pointer; border:none; }
input[type=number],input[type=text] { background:#1e293b; border:1px solid #334155; color:#e2e8f0; padding:8px 12px; border-radius:8px; font-size:14px; font-family:inherit; outline:none; transition:border-color .2s; }
input[type=number]:focus,input[type=text]:focus { border-color:#f59e0b; }
input[type=number] { width:80px; text-align:center; }
input[type=text]   { width:100%; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
.card { background:#1e293b; border-radius:16px; padding:24px; border:1px solid transparent; transition:border-color .3s; animation:fadeIn .35s ease; }
.card:hover { border-color:#334155; }
.section-title { font-family:'Outfit',sans-serif; font-size:20px; font-weight:800; margin-bottom:16px; letter-spacing:-.5px; }
.badge { display:inline-flex; align-items:center; gap:4px; padding:3px 10px; border-radius:20px; font-size:12px; font-weight:600; }
.tab-btn { padding:12px 20px; border:none; background:transparent; cursor:pointer; font-size:14px; font-weight:600; font-family:inherit; transition:all .2s; white-space:nowrap; }
.modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.78); display:flex; align-items:flex-start; justify-content:center; z-index:300; padding:16px; overflow-y:auto; }
.modal { background:#1e293b; border-radius:16px; padding:28px; width:100%; border:1px solid #334155; animation:fadeIn .2s ease; margin:auto; }
.btn { padding:10px 16px; border-radius:8px; border:1px solid transparent; cursor:pointer; font-size:13px; font-weight:600; font-family:inherit; transition:all .2s; }
.btn-primary  { background:#f59e0b; color:#0f172a; border-color:#f59e0b; }
.btn-primary:hover { background:#fbbf24; }
.btn-ghost   { background:transparent; border-color:#334155; color:#94a3b8; }
.btn-ghost:hover { border-color:#475569; color:#e2e8f0; }
.btn-danger  { background:transparent; border-color:#334155; color:#ef4444; }
.btn-danger:hover { border-color:#ef4444; background:rgba(239,68,68,.08); }
.btn-blue    { background:rgba(59,130,246,.1); border-color:#3b82f6; color:#60a5fa; }
.btn-green   { background:rgba(34,197,94,.1); border-color:#22c55e; color:#22c55e; }
.num-input   { background:#0f172a; border:1px solid #334155; color:#e2e8f0; padding:6px 10px; border-radius:8px; font-size:14px; font-family:inherit; outline:none; width:100%; text-align:center; }
.num-input:focus { border-color:#f59e0b; }
</style>

<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useMemo, useCallback } = React;

// ─── Predvolené nastavenia (Fitness Fibel 2.0) ─────────────────────────────
const DEFAULT_SETTINGS = {
  language: 'sk_SK',
  macroRanges: {
    muscle:   { proteinMin: 1.8, proteinMax: 2.0, fatPctMin: 25, fatPctMax: 30 },
    fat_loss: { proteinMin: 2.2, proteinMax: 2.4, fatPctMin: 15, fatPctMax: 20 },
    recomp:   { proteinMin: 1.8, proteinMax: 2.2, fatPctMin: 20, fatPctMax: 25 },
  },
  minFat:         { male: 40, female: 30 },
  defaultSurplus: { male: 300, female: 200 },
  defaultDeficit: 300,
};

// ─── PAL aktivity (Fitness Fibel 2.0, str. 129) ────────────────────────────
const PAL_ACTIVITIES = [
  { id:'sleep',     palMin:0.95, palMax:0.95, hasRange:false, icon:'🌙' },
  { id:'lying',     palMin:1.2,  palMax:1.2,  hasRange:false, icon:'🛏️' },
  { id:'sedentary', palMin:1.4,  palMax:1.5,  hasRange:true,  icon:'💻' },
  { id:'light',     palMin:1.6,  palMax:1.7,  hasRange:true,  icon:'🚶' },
  { id:'standing',  palMin:1.8,  palMax:1.9,  hasRange:true,  icon:'🧑‍🍳' },
  { id:'heavy',     palMin:2.0,  palMax:2.4,  hasRange:true,  icon:'🏗️' },
  { id:'sport',     palMin:2.0,  palMax:2.0,  hasRange:false, icon:'🏋️' },
];
const DEFAULT_HOURS = { sleep:8, lying:7, sedentary:8, light:0, standing:0, heavy:0, sport:1 };

const GOALS = [
  { id:'muscle',   icon:'💪', color:'#22c55e' },
  { id:'fat_loss', icon:'🔥', color:'#ef4444' },
  { id:'recomp',   icon:'🔄', color:'#3b82f6' },
];

// ─── localStorage ──────────────────────────────────────────────────────────
const RECORDS_KEY  = 'ff2_records_v2';
const SETTINGS_KEY = 'ff2_settings_v1';

function loadLS(key, fb) {
  try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fb; }
  catch { return fb; }
}
function saveLS(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch {} }

function mergeSettings(saved) {
  const s = saved || {};
  return {
    ...DEFAULT_SETTINGS, ...s,
    macroRanges: {
      muscle:   { ...DEFAULT_SETTINGS.macroRanges.muscle,   ...(s.macroRanges?.muscle   || {}) },
      fat_loss: { ...DEFAULT_SETTINGS.macroRanges.fat_loss, ...(s.macroRanges?.fat_loss || {}) },
      recomp:   { ...DEFAULT_SETTINGS.macroRanges.recomp,   ...(s.macroRanges?.recomp   || {}) },
    },
    minFat:         { ...DEFAULT_SETTINGS.minFat,          ...(s.minFat          || {}) },
    defaultSurplus: { ...DEFAULT_SETTINGS.defaultSurplus,  ...(s.defaultSurplus  || {}) },
  };
}

function mkActivities() {
  return PAL_ACTIVITIES.map(a => ({ id:a.id, hours:DEFAULT_HOURS[a.id]??0, intensity:0.5 }));
}

// ─── Prekladový systém ─────────────────────────────────────────────────────
function makeT(lang) {
  return function t(key, vars) {
    const loc = window.LOCALES || {};
    const cur = loc[lang]?.keys || {};
    const sk  = loc['sk_SK']?.keys || {};
    let text = cur[key] !== undefined ? cur[key] : (sk[key] !== undefined ? sk[key] : key);
    if (vars) Object.keys(vars).forEach(k => { text = text.split('{'+k+'}').join(String(vars[k])); });
    return text;
  };
}
function availLangs() {
  const l = window.LOCALES || {};
  return Object.keys(l).map(id => ({ id, name: l[id].nativeName, flag: l[id].flag || '' }));
}
function pluralN(n, lang, t) {
  const rule = (window.LOCALES?.[lang]?.pluralRule) || (x => x===1?'one':'many');
  const f = rule(n);
  if (f==='one') return `${n} ${t('records.count.one')}`;
  if (f==='few') return `${n} ${t('records.count.few')}`;
  return `${n} ${t('records.count.many')}`;
}

// ─── Komponenty ────────────────────────────────────────────────────────────
function PieChart({ protein, fat, carbs, size }) {
  size = size || 180;
  const total = protein + fat + carbs;
  if (!total) return null;
  const r=size/2-8, cx=size/2, cy=size/2;
  function arc(s,e) {
    const sa=(s-90)*Math.PI/180, ea=(e-90)*Math.PI/180;
    const x1=cx+r*Math.cos(sa),y1=cy+r*Math.sin(sa),x2=cx+r*Math.cos(ea),y2=cy+r*Math.sin(ea);
    return 'M'+cx+','+cy+' L'+x1+','+y1+' A'+r+','+r+' 0 '+(e-s>180?1:0)+' 1 '+x2+','+y2+' Z';
  }
  function lp(s,e) {
    const m=((s+e)/2-90)*Math.PI/180;
    return { x:cx+r*.62*Math.cos(m), y:cy+r*.62*Math.sin(m) };
  }
  const pP=protein/total, fP=fat/total, cP=carbs/total;
  const a1=0, a2=pP*360, a3=a2+fP*360, a4=360;
  const sl=[{d:arc(a1,a2),fill:'#f59e0b',pct:pP,s:a1,e:a2},{d:arc(a2,a3),fill:'#ef4444',pct:fP,s:a2,e:a3},{d:arc(a3,a4),fill:'#22c55e',pct:cP,s:a3,e:a4}];
  return (
    <svg width={size} height={size} viewBox={'0 0 '+size+' '+size}>
      {sl.map(function(s,i) { return s.pct>0.01 ? (
        <g key={i}>
          <path d={s.d} fill={s.fill} stroke="#1a1a2e" strokeWidth="2"/>
          {s.pct>0.06 ? (function(){ const p=lp(s.s,s.e); return <text x={p.x} y={p.y} textAnchor="middle" dominantBaseline="central" fill="#fff" fontSize="12" fontWeight="700">{Math.round(s.pct*100)}%</text>; })() : null}
        </g>
      ) : null; })}
    </svg>
  );
}

function Slider({ min, max, step, value, onChange, label, unit, color, disabled }) {
  color = color || '#f59e0b';
  const pct = max===min ? 0 : ((value-min)/(max-min))*100;
  return (
    <div style={{marginBottom:12}}>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:13,marginBottom:4,color:'#94a3b8'}}>
        <span>{label}</span>
        <span style={{color:color,fontWeight:700}}>{Number.isInteger(step)?value:value.toFixed(1)} {unit}</span>
      </div>
      <input type="range" min={min} max={max} step={step} value={value} disabled={!!disabled}
        onChange={function(e){ onChange(parseFloat(e.target.value)); }}
        style={{width:'100%',height:6,WebkitAppearance:'none',appearance:'none',
          background:'linear-gradient(to right,'+color+' '+pct+'%,#334155 '+pct+'%)',
          borderRadius:3,outline:'none',cursor:disabled?'not-allowed':'pointer',opacity:disabled?.65:1}}/>
      <div style={{display:'flex',justifyContent:'space-between',fontSize:11,color:'#475569',marginTop:2}}>
        <span>{min} {unit}</span><span>{max} {unit}</span>
      </div>
    </div>
  );
}

// Nápoveda k makrám (vysvetlenia z knihy)
function GoalInfo({ goalId, t }) {
  const [open, setOpen] = useState(false);
  const color = (GOALS.find(function(g){return g.id===goalId;})||{color:'#64748b'}).color;
  const macros = [{key:'protein',icon:'🥩',color:'#f59e0b'},{key:'fat',icon:'🥑',color:'#ef4444'},{key:'carbs',icon:'🍚',color:'#22c55e'}];
  return (
    <div style={{marginTop:12}}>
      <button onClick={function(){ setOpen(function(o){return !o;}); }} style={{
        width:'100%',padding:'9px 14px',borderRadius:10,
        border:'1px solid '+(open?color+'44':'#334155'),
        background:open?color+'0d':'transparent',color:open?color:'#64748b',
        cursor:'pointer',fontFamily:'inherit',fontSize:13,fontWeight:600,
        display:'flex',alignItems:'center',justifyContent:'space-between'}}>
        <span>{t('info.why_macros')}</span>
        <span style={{fontSize:10}}>{open?'▲':'▼'}</span>
      </button>
      {open && (
        <div style={{marginTop:8,background:'#0f172a',borderRadius:10,padding:16,border:'1px solid '+color+'22'}}>
          <div style={{fontFamily:"'Outfit',sans-serif",fontSize:15,fontWeight:800,color:color,marginBottom:6}}>{t('info.'+goalId+'.title')}</div>
          <div style={{fontSize:13,color:'#94a3b8',marginBottom:12,lineHeight:1.65}}>{t('info.'+goalId+'.text')}</div>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {macros.map(function(m){ return (
              <div key={m.key} style={{background:'#1e293b',borderRadius:8,padding:'10px 12px',borderLeft:'3px solid '+m.color,fontSize:13}}>
                <span style={{fontSize:16,marginRight:8}}>{m.icon}</span>
                <span style={{color:m.color,fontWeight:700}}>{t('macro.'+m.key)}: </span>
                <span style={{color:'#94a3b8'}}>{t('info.'+goalId+'.'+m.key)}</span>
              </div>
            ); })}
          </div>
        </div>
      )}
    </div>
  );
}

// Sekcia v nastaveniach
function SettSection({ title, children }) {
  return (
    <div style={{marginBottom:20}}>
      <div style={{fontSize:12,fontWeight:700,color:'#64748b',marginBottom:10,textTransform:'uppercase',letterSpacing:.6}}>{title}</div>
      {children}
    </div>
  );
}

// Modál nastavení
function SettingsModal({ settings, onSave, onClose, t, langs }) {
  const [loc, setLoc] = useState(function(){ return JSON.parse(JSON.stringify(settings)); });
  const [openGoal, setOpenGoal] = useState(null);
  const goals = ['muscle','fat_loss','recomp'];

  function setMacro(gid, field, raw) {
    const n = parseFloat(raw); if (isNaN(n)) return;
    setLoc(function(s){ return {...s, macroRanges:{...s.macroRanges,[gid]:{...s.macroRanges[gid],[field]:n}}}; });
  }
  function setMinFat(g, raw) {
    const n = parseInt(raw); if (isNaN(n)||n<5) return;
    setLoc(function(s){ return {...s, minFat:{...s.minFat,[g]:n}}; });
  }
  function setSurplus(g, raw) {
    const n = parseInt(raw); if (isNaN(n)||n<0) return;
    setLoc(function(s){ return {...s, defaultSurplus:{...s.defaultSurplus,[g]:n}}; });
  }

  return (
    <div className="modal-overlay" onClick={onClose}>
      <div className="modal" style={{maxWidth:520}} onClick={function(e){e.stopPropagation();}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:24}}>
          <div style={{fontFamily:"'Outfit',sans-serif",fontSize:22,fontWeight:900,color:'#e2e8f0'}}>{t('settings.title')}</div>
          <button className="btn btn-ghost" onClick={onClose} style={{fontSize:18,padding:'4px 10px'}}>✕</button>
        </div>

        <SettSection title={t('settings.lang.label')}>
          <div style={{fontSize:12,color:'#64748b',marginBottom:10}}>{t('settings.lang.note')}</div>
          <div style={{display:'flex',gap:8,flexWrap:'wrap'}}>
            {langs.map(function(l){ return (
              <button key={l.id} onClick={function(){ setLoc(function(s){return {...s,language:l.id};}); }} style={{
                padding:'8px 16px',borderRadius:8,border:'1px solid',fontFamily:'inherit',fontSize:13,fontWeight:700,cursor:'pointer',
                borderColor:loc.language===l.id?'#f59e0b':'#334155',
                background:loc.language===l.id?'rgba(245,158,11,.15)':'#0f172a',
                color:loc.language===l.id?'#f59e0b':'#94a3b8'}}>
                {l.flag} {l.name}
              </button>
            ); })}
          </div>
        </SettSection>

        <SettSection title={t('settings.macros.title')}>
          <div style={{fontSize:12,color:'#64748b',marginBottom:12}}>{t('settings.macros.note')}</div>
          {goals.map(function(gid){
            const g = GOALS.find(function(x){return x.id===gid;}) || {icon:'',color:'#64748b'};
            const mr = loc.macroRanges[gid];
            const isOpen = openGoal===gid;
            return (
              <div key={gid} style={{marginBottom:8}}>
                <button onClick={function(){ setOpenGoal(isOpen?null:gid); }} style={{
                  width:'100%',padding:'10px 14px',borderRadius:isOpen?'10px 10px 0 0':10,
                  border:'1px solid '+(isOpen?g.color+'55':'#334155'),borderBottom:isOpen?'none':'1px solid '+(isOpen?g.color+'55':'#334155'),
                  background:isOpen?g.color+'0d':'transparent',cursor:'pointer',fontFamily:'inherit',
                  display:'flex',alignItems:'center',justifyContent:'space-between',
                  color:isOpen?g.color:'#e2e8f0',fontSize:14,fontWeight:600}}>
                  <span>{g.icon} {t('goal.'+gid)}</span>
                  <span style={{fontSize:10}}>{isOpen?'▲':'▼'}</span>
                </button>
                {isOpen && (
                  <div style={{background:'#0f172a',borderRadius:'0 0 10px 10px',padding:'14px 16px',
                    border:'1px solid '+g.color+'22',borderTop:'none',
                    display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
                    {[
                      {label:t('settings.protein.min'),field:'proteinMin',unit:t('settings.protein.unit'),step:'0.1'},
                      {label:t('settings.protein.max'),field:'proteinMax',unit:t('settings.protein.unit'),step:'0.1'},
                      {label:t('settings.fat.min'),    field:'fatPctMin', unit:t('settings.fat.unit'),     step:'1'},
                      {label:t('settings.fat.max'),    field:'fatPctMax', unit:t('settings.fat.unit'),     step:'1'},
                    ].map(function(f){ return (
                      <div key={f.field}>
                        <div style={{fontSize:11,color:'#64748b',marginBottom:4}}>{f.label} ({f.unit})</div>
                        <input className="num-input" type="number" step={f.step} value={mr[f.field]}
                          onChange={function(e){ setMacro(gid,f.field,e.target.value); }}/>
                      </div>
                    ); })}
                  </div>
                )}
              </div>
            );
          })}
        </SettSection>

        <SettSection title={t('settings.biological.title')}>
          <div style={{fontSize:12,color:'#64748b',marginBottom:12}}>{t('settings.biological.note')}</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            {[{g:'male',label:t('gender.male')},{g:'female',label:t('gender.female')}].map(function(x){ return (
              <div key={x.g}>
                <div style={{fontSize:11,color:'#64748b',marginBottom:4}}>{x.label} {t('settings.biological.fat_min')} (g)</div>
                <input className="num-input" type="number" min="5" step="5" value={loc.minFat[x.g]}
                  onChange={function(e){ setMinFat(x.g, e.target.value); }}/>
              </div>
            ); })}
          </div>
        </SettSection>

        <SettSection title={t('settings.defaults.title')}>
          <div style={{fontSize:12,color:'#64748b',marginBottom:12}}>{t('settings.defaults.note')}</div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:12}}>
            {[{g:'male',label:t('gender.male')},{g:'female',label:t('gender.female')}].map(function(x){ return (
              <div key={x.g}>
                <div style={{fontSize:11,color:'#64748b',marginBottom:4}}>{x.label} {t('settings.defaults.surplus')} (kcal)</div>
                <input className="num-input" type="number" min="0" step="50" value={loc.defaultSurplus[x.g]}
                  onChange={function(e){ setSurplus(x.g, e.target.value); }}/>
              </div>
            ); })}
          </div>
        </SettSection>

        <div style={{display:'flex',gap:8,marginTop:24}}>
          <button className="btn btn-primary" onClick={function(){ onSave(loc); onClose(); }} style={{flex:1}}>{t('settings.save')}</button>
          <button className="btn btn-ghost" onClick={onClose} style={{flex:1}}>{t('settings.cancel')}</button>
        </div>
      </div>
    </div>
  );
}

// Komponenta výpočtu kalórií
function CalcWorker() {
  const [gender, setGender] = useState('male');
  const [weight, setWeight] = useState(80);
  const [goal, setGoal] = useState('muscle');
  const [kcalOrWeek, setKcalOrWeek] = useState('kcal');
  const [weeklyChange, setWeeklyChange] = useState(0.5);
  const [activities, setActivities] = useState(mkActivities);
  const [macros, setMacros] = useState({ protein:180, fat:70 });
  const [settings, setSettings] = useState(function(){ return mergeSettings(loadLS(SETTINGS_KEY)); });
  const [showSettings, setShowSettings] = useState(false);
  const [records, setRecords] = useState(function(){ return loadLS(RECORDS_KEY, []); });
  const [showRecords, setShowRecords] = useState(false);
  const [editRecord, setEditRecord] = useState(null);
  const t = useMemo(function(){ return makeT(settings.language); }, [settings.language]);
  const langs = useMemo(function(){ return availLangs(); }, []);

  // Zmena nastavení
  function handleSettingsSave(newSettings) {
    setSettings(mergeSettings(newSettings));
    saveLS(SETTINGS_KEY, newSettings);
  }

  // Zmena pohlavia
  function handleGenderChange(g) {
    setGender(g);
    const defSurplus = settings.defaultSurplus[g] || 300;
    recalc(weight, g, goal, kcalOrWeek, kcalOrWeek==='kcal'?null:weeklyChange, activities, defSurplus);
  }

  // Zmena váhy
  function handleWeightChange(raw) {
    const w = parseFloat(raw) || 0;
    setWeight(w);
    // Bez minima počas zadávania
    const defSurplus = settings.defaultSurplus[gender] || 300;
    if (w > 0) {
      recalc(w, gender, goal, kcalOrWeek, kcalOrWeek==='kcal'?null:weeklyChange, activities, defSurplus);
    }
  }

  // Keď hráč opustí pole (onBlur) – vynútiť minimum
  function handleWeightBlur() {
    let w = weight;
    if (!w || w < 1) {
      w = 80; // Bezpečné minimum
      setWeight(80);
    }
    const defSurplus = settings.defaultSurplus[gender] || 300;
    recalc(w, gender, goal, kcalOrWeek, kcalOrWeek==='kcal'?null:weeklyChange, activities, defSurplus);
  }

  // Zmena cieľa
  function handleGoalChange(g) {
    setGoal(g);
    const defSurplus = settings.defaultSurplus[gender] || 300;
    recalc(weight, gender, g, kcalOrWeek, kcalOrWeek==='kcal'?null:weeklyChange, activities, defSurplus);
  }

  // Prepínač kcal/týždeň
  function handleModeChange(mode) {
    setKcalOrWeek(mode);
    const defSurplus = settings.defaultSurplus[gender] || 300;
    recalc(weight, gender, goal, mode, mode==='kcal'?null:weeklyChange, activities, defSurplus);
  }

  // Zmena týždennej zmeny
  function handleWeeklyChange(val) {
    setWeeklyChange(val);
    recalc(weight, gender, goal, 'week', val, activities, settings.defaultSurplus[gender] || 300);
  }

  // Zmena počtu hodín aktivity
  function handleActivityHours(idx, hours) {
    const newAct = [...activities];
    newAct[idx] = {...newAct[idx], hours: Math.max(0, hours)};
    setActivities(newAct);
    const defSurplus = settings.defaultSurplus[gender] || 300;
    recalc(weight, gender, goal, kcalOrWeek, kcalOrWeek==='kcal'?null:weeklyChange, newAct, defSurplus);
  }

  // Zmena intenzity aktivity
  function handleActivityIntensity(idx, intensity) {
    const newAct = [...activities];
    newAct[idx] = {...newAct[idx], intensity};
    setActivities(newAct);
    const defSurplus = settings.defaultSurplus[gender] || 300;
    recalc(weight, gender, goal, kcalOrWeek, kcalOrWeek==='kcal'?null:weeklyChange, newAct, defSurplus);
  }

  // Výpočet
  function recalc(w, g, goal, mode, weeklyVal, acts, defSurplus) {
    const bmr = (g==='male'?1.0:0.9) * w * 24;
    let tdee = 0, pal = 0;
    let totalHours = 0, totalIntensityHours = 0;

    // Výpočet PAL a TDEE
    PAL_ACTIVITIES.forEach(function(a,i) {
      const act = acts[i];
      if (!act) return;
      const intFactorMin = a.palMin;
      const intFactorMax = a.palMax;
      const intFactor = intFactorMin + (intFactorMax - intFactorMin) * act.intensity;
      totalIntensityHours += act.hours * intFactor;
      totalHours += act.hours;
    });

    pal = totalHours > 0 ? totalIntensityHours / 24 : 1.0;
    tdee = bmr * pal;

    // Aplikácia cieľa
    let kcal = tdee;
    if (mode === 'kcal') {
      const delta = goal==='muscle' ? defSurplus : (goal==='fat_loss' ? -300 : 0);
      kcal = tdee + delta;
    } else if (mode === 'week') {
      kcal = tdee + (weeklyVal * 7700 / 7);
    }

    // Výpočet makrá
    const mr = settings.macroRanges[goal];
    let protein = w * (mr.proteinMin + (mr.proteinMax - mr.proteinMin) * 0.5);
    let fat = kcal * (mr.fatPctMin + (mr.fatPctMax - mr.fatPctMin) * 0.5) / 100 / 9;
    const minFat = settings.minFat[g] || 40;
    if (fat < minFat) fat = minFat;

    const proteinCals = protein * 4;
    const fatCals = fat * 9;
    const carbCals = Math.max(0, kcal - proteinCals - fatCals);
    const carbs = carbCals / 4;

    setMacros({ protein: Math.round(protein * 10) / 10, fat: Math.round(fat * 10) / 10, carbs: Math.round(carbs * 10) / 10, kcal: Math.round(kcal) });
  }

  // Uloženie záznamu
  function handleSaveRecord() {
    const newRecord = {
      id: Date.now(),
      name: editRecord?.name || `${gender[0].toUpperCase()} ${weight}kg ${goal} ${new Date().toLocaleDateString()}`,
      gender, weight, goal, kcalOrWeek, weeklyChange, activities: JSON.parse(JSON.stringify(activities)), macros: JSON.parse(JSON.stringify(macros)), date: new Date().toISOString(),
    };
    let updatedRecords = records.filter(function(r){ return r.id !== editRecord?.id; });
    updatedRecords = [newRecord, ...updatedRecords];
    setRecords(updatedRecords);
    saveLS(RECORDS_KEY, updatedRecords);
    setEditRecord(null);
  }

  // Načítanie záznamu
  function handleLoadRecord(rec) {
    setGender(rec.gender);
    setWeight(rec.weight);
    setGoal(rec.goal);
    setKcalOrWeek(rec.kcalOrWeek);
    setWeeklyChange(rec.weeklyChange);
    setActivities(JSON.parse(JSON.stringify(rec.activities)));
    setMacros(JSON.parse(JSON.stringify(rec.macros)));
    setEditRecord(null);
    setShowRecords(false);
  }

  // Vymazanie záznamu
  function handleDeleteRecord(id) {
    const updatedRecords = records.filter(function(r){ return r.id !== id; });
    setRecords(updatedRecords);
    saveLS(RECORDS_KEY, updatedRecords);
  }

  const maleColor = '#3b82f6', femaleColor = '#ec4899';
  const genderColor = gender === 'male' ? maleColor : femaleColor;

  // Skrytý počítadlo veľkosti TDEE a BMR
  const acts = activities;
  let totalHours = 0, totalIntensityHours = 0;
  PAL_ACTIVITIES.forEach(function(a,i) {
    const act = acts[i];
    if (!act) return;
    const intFactorMin = a.palMin;
    const intFactorMax = a.palMax;
    const intFactor = intFactorMin + (intFactorMax - intFactorMin) * act.intensity;
    totalIntensityHours += act.hours * intFactor;
    totalHours += act.hours;
  });
  const pal = totalHours > 0 ? totalIntensityHours / 24 : 1.0;
  const bmr = (gender==='male'?1.0:0.9) * (parseFloat(weight) || 0) * 24;
  const tdee = bmr * pal;
  const hoursSum = activities.reduce(function(s,a){ return s+a.hours; },0);
  const hoursValid = Math.abs(hoursSum - 24) < 0.5;

  return (
    <div style={{minHeight:'100vh',background:'linear-gradient(135deg,#0f172a 0%,#1a1f2e 100%)',padding:'16px',paddingTop:56}}>
      <div style={{maxWidth:960,margin:'0 auto'}}>

        {/* Header */}
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:32,position:'fixed',top:0,left:0,right:0,background:'rgba(15,23,42,.95)',backdropFilter:'blur(10px)',padding:'12px 16px',zIndex:100}}>
          <div style={{fontFamily:"'Outfit',sans-serif",fontSize:18,fontWeight:900,color:'#f59e0b'}}>🧮 {t('app.title')}</div>
          <div style={{display:'flex',gap:8}}>
            <button className="btn btn-ghost" onClick={function(){ setShowRecords(function(s){return !s;}); }} title={t('records.title')}>{t('records.title')}</button>
            <button className="btn btn-ghost" onClick={function(){ setShowSettings(true); }} title={t('settings.title')}>⚙️</button>
          </div>
        </div>

        {showSettings && <SettingsModal settings={settings} onSave={handleSettingsSave} onClose={function(){ setShowSettings(false); }} t={t} langs={langs}/>}

        {/* Záznamy */}
        {showRecords && (
          <div className="modal-overlay" onClick={function(){ setShowRecords(false); }}>
            <div className="modal" style={{maxWidth:500}} onClick={function(e){e.stopPropagation();}}>
              <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',marginBottom:20}}>
                <div style={{fontFamily:"'Outfit',sans-serif",fontSize:20,fontWeight:800}}>{t('records.title')} {pluralN(records.length, settings.language, t)}</div>
                <button className="btn btn-ghost" onClick={function(){ setShowRecords(false); }} style={{fontSize:18,padding:'4px 10px'}}>✕</button>
              </div>
              {records.length===0 ? (
                <div style={{color:'#64748b',fontSize:14}}>{t('records.empty')}</div>
              ) : (
                <div style={{display:'flex',flexDirection:'column',gap:8}}>
                  {records.map(function(rec){ return (
                    <div key={rec.id} style={{background:'#0f172a',borderRadius:10,padding:12,border:'1px solid #334155',display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                      <div style={{flex:1,cursor:'pointer'}} onClick={function(){ handleLoadRecord(rec); }}>
                        <div style={{fontSize:13,fontWeight:600}}>{rec.name}</div>
                        <div style={{fontSize:11,color:'#64748b',marginTop:2}}>{rec.macros.kcal} kcal • {rec.gender==='male'?'👨':'👩'} {rec.weight}kg</div>
                      </div>
                      <button className="btn btn-danger" onClick={function(){ handleDeleteRecord(rec.id); }} style={{fontSize:12}}>×</button>
                    </div>
                  ); })}
                </div>
              )}
            </div>
          </div>
        )}

        {/* Základné parametre */}
        <div className="card" style={{marginBottom:20}}>
          <div className="section-title">{t('basic.title')}</div>
          <div style={{display:'grid',gridTemplateColumns:'repeat(2,1fr)',gap:16,marginBottom:16}}>
            <div>
              <div style={{fontSize:12,color:'#64748b',marginBottom:8,fontWeight:600}}>{t('basic.gender')}</div>
              <div style={{display:'flex',gap:8}}>
                {['male','female'].map(function(g){ return (
                  <button key={g} onClick={function(){ handleGenderChange(g); }} style={{
                    flex:1,padding:10,borderRadius:8,border:'1px solid',cursor:'pointer',fontFamily:'inherit',fontSize:13,fontWeight:600,
                    borderColor:gender===g?genderColor:'#334155',
                    background:gender===g?'rgba(59,130,246,.1)':'#0f172a',
                    color:gender===g?genderColor:'#94a3b8'}}>
                    {gender===g?'●':''} {t('gender.'+g)}
                  </button>
                ); })}
              </div>
            </div>
            <div>
              <div style={{fontSize:12,color:'#64748b',marginBottom:8,fontWeight:600}}>{t('basic.weight')} (kg)</div>
              <input type="number" placeholder="80" value={weight||''}
                onChange={function(e){ handleWeightChange(e.target.value); }}
                onBlur={handleWeightBlur}
                style={{width:'100%',padding:'10px 12px',background:'#0f172a',border:'1px solid '+genderColor,borderRadius:8,color:genderColor,fontWeight:700,fontSize:14}}/>
            </div>
          </div>
        </div>

        {/* Cieľ */}
        <div className="card" style={{marginBottom:20}}>
          <div className="section-title">{t('goal.title')}</div>
          <div style={{display:'flex',gap:12,flexWrap:'wrap'}}>
            {GOALS.map(function(g){ return (
              <button key={g.id} onClick={function(){ handleGoalChange(g.id); }} style={{
                flex:'0 1 calc(33% - 8px)',minWidth:100,padding:14,borderRadius:12,border:'1px solid',cursor:'pointer',fontFamily:'inherit',fontSize:14,fontWeight:700,transition:'all .2s',
                borderColor:goal===g.id?g.color+'99':'#334155',
                background:goal===g.id?g.color+'15':'#0f172a',
                color:goal===g.id?g.color:'#e2e8f0'}}>
                <div style={{fontSize:24,marginBottom:4}}>{g.icon}</div>
                {t('goal.'+g.id)}
              </button>
            ); })}
          </div>
          <GoalInfo goalId={goal} t={t}/>
        </div>

        {/* Energetické zadanie */}
        <div className="card" style={{marginBottom:20}}>
          <div className="section-title">{t('energy.title')}</div>
          <div style={{display:'flex',gap:8,marginBottom:16}}>
            {['kcal','week'].map(function(m){ return (
              <button key={m} onClick={function(){ handleModeChange(m); }} style={{
                flex:1,padding:10,borderRadius:8,border:'1px solid',cursor:'pointer',fontFamily:'inherit',fontSize:13,fontWeight:600,
                borderColor:kcalOrWeek===m?'#f59e0b':'#334155',
                background:kcalOrWeek===m?'rgba(245,158,11,.15)':'#0f172a',
                color:kcalOrWeek===m?'#f59e0b':'#94a3b8'}}>
                {m==='kcal'?t('energy.kcal'):t('energy.week')}
              </button>
            ); })}
          </div>
          {kcalOrWeek==='week' && (
            <Slider min={-1.5} max={1.5} step={0.1} value={weeklyChange} onChange={handleWeeklyChange}
              label={t('energy.weekly_change')} unit={t('energy.kgweek')} color="#f59e0b"/>
          )}
        </div>

        {/* Aktivity */}
        <div className="card" style={{marginBottom:20}}>
          <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:16}}>
            <div className="section-title" style={{margin:0}}>🕐 {t('activities.title')}</div>
            <span style={{fontSize:11,color:hoursValid?'#22c55e':'#ef4444',fontWeight:700,background:hoursValid?'rgba(34,197,94,.1)':'rgba(239,68,68,.1)',padding:'3px 10px',borderRadius:16}}>
              {hoursSum.toFixed(1)}h / 24h
            </span>
          </div>
          {PAL_ACTIVITIES.map(function(a,i){ return (
            <div key={a.id} style={{marginBottom:16,background:'#0f172a',borderRadius:12,padding:12,border:'1px solid #334155'}}>
              <div style={{fontSize:13,fontWeight:600,marginBottom:12,display:'flex',alignItems:'center',gap:6}}>
                <span style={{fontSize:20}}>{a.icon}</span>
                <span>{t('pal.'+a.id)}</span>
              </div>
              <Slider min={0} max={24} step={0.5} value={activities[i].hours} onChange={function(v){ handleActivityHours(i, v); }} label={t('activities.hours')} unit="h" color="#94a3b8"/>
              {a.hasRange && (
                <Slider min={0} max={1} step={0.05} value={activities[i].intensity} onChange={function(v){ handleActivityIntensity(i, v); }} label={t('activities.intensity')} unit="" color="#64748b"/>
              )}
            </div>
          ); })}
        </div>

        {/* Makrá */}
        <div className="card" style={{marginBottom:20}}>
          <div className="section-title">{t('macros.title')}</div>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
            <div>
              <div style={{fontSize:28,fontWeight:900,color:'#f59e0b'}}>{macros.kcal||0} <span style={{fontSize:14,color:'#64748b',fontWeight:600}}>kcal</span></div>
              <div style={{fontSize:12,color:'#64748b',marginTop:2}}>{tdee.toFixed(0)} TDEE • {bmr.toFixed(0)} BMR • PAL {pal.toFixed(2)}</div>
            </div>
            <PieChart protein={macros.protein||0} fat={macros.fat||0} carbs={macros.carbs||0} size={120}/>
          </div>
          <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 1fr',gap:12}}>
            {[{key:'protein',color:'#f59e0b'},{key:'fat',color:'#ef4444'},{key:'carbs',color:'#22c55e'}].map(function(m){ return (
              <div key={m.key} style={{background:'#0f172a',borderRadius:8,padding:12,border:'1px solid '+m.color+'22'}}>
                <div style={{fontSize:11,color:'#64748b',marginBottom:4,textTransform:'uppercase',fontWeight:700}}>{t('macro.'+m.key)}</div>
                <div style={{fontSize:20,fontWeight:900,color:m.color}}>{macros[m.key]||0} <span style={{fontSize:11}}>{m.key==='protein' || m.key==='carbs'?'g':'g'}</span></div>
              </div>
            ); })}
          </div>
        </div>

        {/* Výžyvové pravidlá */}
        <div className="card" style={{marginBottom:100}}>
          <div className="section-title">{t('nutrition.title')}</div>
          <div style={{display:'flex',flexDirection:'column',gap:10}}>
            {[
              {icon:'🥗',label:t('nutrition.fiber'),value:t('nutrition.fiber_range')},
              {icon:'💧',label:t('nutrition.water'),value:(Math.round((parseFloat(weight)||80)/20*10)/10)+' L'},
              {icon:'⚖️',label:t('nutrition.balance'),value:t('nutrition.balance_rule')},
            ].map(function(r,i){ return (
              <div key={i} style={{background:'#0f172a',borderRadius:8,padding:12,border:'1px solid #334155',display:'flex',alignItems:'center',gap:12}}>
                <span style={{fontSize:20}}>{r.icon}</span>
                <div style={{flex:1}}>
                  <div style={{fontSize:12,color:'#64748b',fontWeight:600}}>{r.label}</div>
                  <div style={{fontSize:14,fontWeight:700,color:'#e2e8f0',marginTop:2}}>{r.value}</div>
                </div>
              </div>
            ); })}
          </div>
        </div>

        {/* Tlačidlo na uloženie */}
        <div style={{position:'fixed',bottom:16,left:16,right:16,background:'rgba(15,23,42,.95)',backdropFilter:'blur(10px)',padding:12,borderRadius:12,display:'flex',gap:8,maxWidth:960,margin:'0 auto'}}>
          <button onClick={handleSaveRecord} style={{
            flex:1,padding:12,borderRadius:8,border:'none',background:'#f59e0b',color:'#0f172a',fontWeight:700,fontSize:14,cursor:'pointer',fontFamily:'inherit',transition:'all .2s'}}>
            {editRecord?' ✎ '+t('records.update'):' + '+t('records.add')}
          </button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<CalcWorker />, document.getElementById('root'));
</script>
</body>
</html>
